# Pipeline for subjective_taggy.
# Runs on every push to main, on pull requests, and by hand (Actions -> Pipeline -> Run workflow).
# Status of every project's last run: dashboard -> ST Backend -> Pipelines.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Create virtualenv
        run: |
          uv venv --python 3.11 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          grep -vE '^\s*-e\s+(/|file:)|^\s*(/|file:)' requirements.txt > /tmp/requirements-ci.txt || true
          uv pip install -r /tmp/requirements-ci.txt
          uv pip install pytest
      - name: Byte-compile (no tests yet)
        run: python -m compileall -q -x '(^|/)(\.venv|node_modules|build|dist)/' .
